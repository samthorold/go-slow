# Runs go-slow from the same image, configured the same way, as it runs
# anywhere else: on the Owner's laptop, started each day to read (see the
# runbook in CLAUDE.md). Needs a .env: `cp .env.example .env`.
services:
  app:
    build: .
    env_file: .env
    ports:
      # Private: published on the loopback interface only, so no one else
      # on a shared network can reach the Record.
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    volumes:
      # The Record lives in an ordinary folder on the host, named in .env,
      # so it can be seen, copied and kept across Docker resets.
      - "${RECORD_DIR:?set RECORD_DIR in .env}:/app/data"
    # docker stop sends SIGTERM, then kills after this; the app drains within 5s.
    stop_grace_period: 10s
