version: "2"

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - usestdlibvars

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/samthorold/go-slow
