# The repo's checks. CI runs exactly these, on a PR's changed files
# (--from-ref the base), or on every file when a PR changes this file or a
# workflow, and on a push to main: see .github/workflows/ci.yml. A hook's
# files: filter is what decides whether CI runs it, so it names everything the
# hook depends on.
#
# go test is at the manual stage: it never runs on commit or push, only when
# asked (pre-commit run --hook-stage manual go-test), and CI asks. Every other
# hook runs at every stage, manual included, so CI's one manual-stage run is
# all of them. Locally, run go test on the packages being changed.
minimum_pre_commit_version: "4.5.0"

# Vendored files stay byte-identical to upstream, so their hash still matches.
exclude: ^internal/web/static/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files

  # actionlint shellchecks workflow run: steps only with a shellcheck on its
  # PATH; shellcheck-py installs one into the hook's own environment.
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        additional_dependencies: [shellcheck-py==0.11.0.1]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Go hooks run the toolchain go.mod pins (GOTOOLCHAIN=auto fetches it) and
  # the golangci-lint tools/go.mod pins.
  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy -diff
        language: system
        files: (^|/)go\.(mod|sum)$|\.go$
        pass_filenames: false
      - id: go-mod-tidy-tools
        name: go mod tidy (tools)
        entry: go -C tools mod tidy -diff
        language: system
        files: ^tools/go\.(mod|sum)$
        pass_filenames: false
      - id: golangci-lint-fmt
        name: golangci-lint fmt
        entry: go tool -modfile=tools/go.mod golangci-lint fmt
        language: system
        # Its formatters are configured in .golangci.yml, and its version
        # pinned in tools/go.mod.
        files: \.go$|^\.golangci\.yml$|(^|/)go\.(mod|sum)$
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint run
        entry: go tool -modfile=tools/go.mod golangci-lint run ./...
        language: system
        files: \.go$|^\.golangci\.yml$|(^|/)go\.(mod|sum)$
        pass_filenames: false
      - id: go-test
        name: go test
        entry: go test -race ./...
        language: system
        # Manual: the full suite runs only in CI (see the top of this file).
        stages: [manual]
        # Everything the tests read: Go, the embedded templates, static files
        # and migrations, every testdata/ (a PR that only re-records must
        # replay its recordings), .env.example (the model pins the recordings
        # answer), and the checks themselves.
        files: \.go$|\.html$|\.sql$|\.css$|\.js$|(^|/)go\.(mod|sum)$|(^|/)testdata/|^\.env\.example$|^\.pre-commit-config\.yaml$|^\.github/workflows/
        pass_filenames: false
